<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抬餐人員排班表</title>

<style>

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

h2 {
    margin-top: 25px;
}

select {
    padding: 10px 15px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
}

.holidays {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.holiday {
    background: #f1f1f1;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.holiday input {
    margin-right: 5px;
    transform: scale(1.2);
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    background: #3498db;
    color: white;
}

button:hover {
    background: #2980b9;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: #34495e;
    color: white;
    padding: 13px 8px;
}

td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 13px 8px;
}

.number {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    background: #3498db;
    color: white;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    font-size: 18px;
    font-weight: bold;
}

.holiday-row {
    background: #ffecec;
    color: #e74c3c;
    font-weight: bold;
}

.info {
    margin-top: 15px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    table {
        font-size: 14px;
    }

    .number {
        width: 34px;
        height: 34px;
        font-size: 15px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>🍱 抬餐人員排班表</h1>

<div class="subtitle">
每天 4 人｜自動跳過 21、27、28 號
</div>

<h2>① 星期一第一位</h2>

<select id="start"></select>

<h2>② 放假設定</h2>

<div class="holidays">

<label class="holiday">
<input type="checkbox" id="mon">
星期一放假
</label>

<label class="holiday">
<input type="checkbox" id="tue">
星期二放假
</label>

<label class="holiday">
<input type="checkbox" id="wed">
星期三放假
</label>

<label class="holiday">
<input type="checkbox" id="thu">
星期四放假
</label>

<label class="holiday">
<input type="checkbox" id="fri">
星期五放假
</label>

</div>

<button onclick="makeSchedule()">
🔄 重新排班
</button>

<h2>③ 本週抬餐人員</h2>

<table>

<thead>

<tr>
<th>星期</th>
<th>第 1 人</th>
<th>第 2 人</th>
<th>第 3 人</th>
<th>第 4 人</th>
</tr>

</thead>

<tbody id="result">
</tbody>

</table>

<div class="info">
不排班：21、27、28 號
</div>

</div>

<script>

/* ================================
   可排班學生
   1～34號
   排除21、27、28
================================ */

let people = [];

for (let i = 1; i <= 34; i++) {

    if (
        i !== 21 &&
        i !== 27 &&
        i !== 28
    ) {

        people.push(i);

    }

}


/* ================================
   星期
================================ */

let days = [

    ["星期一", "mon"],

    ["星期二", "tue"],

    ["星期三", "wed"],

    ["星期四", "thu"],

    ["星期五", "fri"]

];


/* ================================
   建立下拉選單
================================ */

let start =
    document.getElementById("start");


for (let number of people) {

    let option =
        document.createElement("option");

    option.value = number;

    option.textContent =
        number + " 號";

    start.appendChild(option);

}


/* ================================
   產生排班
================================ */

function makeSchedule() {

    /*
       取得星期一第一位
    */

    let startNumber =
        Number(start.value);


    /*
       找到這個號碼的位置
    */

    let index =
        people.indexOf(startNumber);


    /*
       取得表格
    */

    let result =
        document.getElementById("result");


    /*
       清除原本的表格
    */

    result.innerHTML = "";


    /*
       星期一～星期五
    */

    for (let day of days) {

        let dayName = day[0];

        let checkboxID = day[1];


        /*
           判斷是否放假
        */

        let holiday =
            document.getElementById(
                checkboxID
            ).checked;


        let row =
            document.createElement("tr");


        /* ==========================
           放假
        ========================== */

        if (holiday) {

            row.className =
                "holiday-row";


            row.innerHTML =

                "<td>" +
                dayName +
                "</td>" +

                "<td colspan='4'>" +
                "🎉 放假" +
                "</td>";

        }


        /* ==========================
           正常上課
        ========================== */

        else {

            let numbers = [];


            /*
               每天4人
            */

            for (let i = 0; i < 4; i++) {

                numbers.push(
                    people[index]
                );


                /*
                   下一個號碼
                */

                index++;


                /*
                   到最後一號
                   回到第一號
                */

                if (
                    index >= people.length
                ) {

                    index = 0;

                }

            }


            /*
               放入表格
            */

            row.innerHTML =

                "<td><b>" +
                dayName +
                "</b></td>" +

                "<td>" +
                "<span class='number'>" +
                numbers[0] +
                "</span>" +
                "</td>" +

                "<td>" +
                "<span class='number'>" +
                numbers[1] +
                "</span>" +
                "</td>" +

                "<td>" +
                "<span class='number'>" +
                numbers[2] +
                "</span>" +
                "</td>" +

                "<td>" +
                "<span class='number'>" +
                numbers[3] +
                "</span>" +
                "</td>";

        }


        result.appendChild(row);

    }

}


/* ================================
   點選放假後自動更新
================================ */

for (let day of days) {

    document
        .getElementById(day[1])
        .addEventListener(
            "change",
            makeSchedule
        );

}


/* ================================
   更改星期一第一位
   自動更新
================================ */

start.addEventListener(
    "change",
    makeSchedule
);


/* ================================
   網頁開啟時產生表格
================================ */

makeSchedule();

</script>

</body>
</html>

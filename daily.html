<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>值日生排班表</title>

<style>

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

h2 {
    margin-top: 25px;
}

select {
    padding: 10px 15px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
}

.holidays {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.holiday {
    background: #f1f1f1;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.holiday input {
    margin-right: 5px;
    transform: scale(1.2);
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    background: #3498db;
    color: white;
}

button:hover {
    background: #2980b9;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    table-layout: fixed;
}

th {
    background: #34495e;
    color: white;
    padding: 13px 8px;
}

td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 13px 8px;
}

.person-title {
    background: #f1f1f1;
    font-weight: bold;
    width: 100px;
}

.number {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    background: #3498db;
    color: white;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    font-size: 18px;
    font-weight: bold;
}

.holiday-cell {
    background: #ffecec;
    color: #e74c3c;
    font-weight: bold;
}

.info {
    margin-top: 15px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    table {
        font-size: 14px;
    }

    .number {
        width: 34px;
        height: 34px;
        font-size: 15px;
    }

    .person-title {
        width: 70px;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>🧹 值日生排班表</h1>

<div class="subtitle">
每天 2 人｜1～34 號皆可排班
</div>


<h2>① 星期一第一位</h2>

<select id="start"></select>


<h2>② 放假設定</h2>

<div class="holidays">

<label class="holiday">
<input type="checkbox" id="mon">
星期一放假
</label>

<label class="holiday">
<input type="checkbox" id="tue">
星期二放假
</label>

<label class="holiday">
<input type="checkbox" id="wed">
星期三放假
</label>

<label class="holiday">
<input type="checkbox" id="thu">
星期四放假
</label>

<label class="holiday">
<input type="checkbox" id="fri">
星期五放假
</label>

</div>


<button onclick="makeSchedule()">
🔄 重新排班
</button>


<h2>③ 本週值日生</h2>

<table>

<thead>

<tr>

<th>人員</th>

<th>星期一</th>

<th>星期二</th>

<th>星期三</th>

<th>星期四</th>

<th>星期五</th>

</tr>

</thead>

<tbody id="result">
</tbody>

</table>


<div class="info">
值日生：1～34 號
</div>

</div>


<script>

/* ================================
   可排班學生
   1～34號
================================ */

let people = [];

for (let i = 1; i <= 34; i++) {

    people.push(i);

}


/* ================================
   星期
================================ */

let days = [

    ["星期一", "mon"],

    ["星期二", "tue"],

    ["星期三", "wed"],

    ["星期四", "thu"],

    ["星期五", "fri"]

];


/* ================================
   建立下拉選單
================================ */

let start =
    document.getElementById("start");


for (let number of people) {

    let option =
        document.createElement("option");

    option.value = number;

    option.textContent =
        number + " 號";

    start.appendChild(option);

}


/* ================================
   產生排班
================================ */

function makeSchedule() {

    /*
       取得星期一第一位
    */

    let startNumber =
        Number(start.value);


    /*
       找到這個號碼的位置
    */

    let index =
        people.indexOf(startNumber);


    /*
       儲存每天的兩位人員
    */

    let schedule = [];


    /*
       星期一～星期五
    */

    for (let day of days) {

        let checkboxID = day[1];


        /*
           判斷是否放假
        */

        let holiday =
            document.getElementById(
                checkboxID
            ).checked;


        /*
           放假
        */

        if (holiday) {

            schedule.push(null);

        }


        /*
           正常上課
        */

        else {

            let numbers = [];


            /*
               每天2人
            */

            for (let i = 0; i < 2; i++) {

                numbers.push(
                    people[index]
                );


                index++;


                /*
                   到34號後
                   回到1號
                */

                if (
                    index >= people.length
                ) {

                    index = 0;

                }

            }

            schedule.push(numbers);

        }

    }


    /*
       取得表格
    */

    let result =
        document.getElementById("result");


    /*
       清除原本表格
    */

    result.innerHTML = "";


    /*
       建立第一人、第二人兩列
    */

    for (
        let person = 0;
        person < 2;
        person++
    ) {

        let row =
            document.createElement("tr");


        /*
           左側顯示第一人 / 第二人
        */

        let title =
            document.createElement("td");

        title.className =
            "person-title";

        title.textContent =
            person === 0
                ? "第一人"
                : "第二人";

        row.appendChild(title);


        /*
           星期一～星期五
        */

        for (
            let day = 0;
            day < 5;
            day++
        ) {

            let cell =
                document.createElement("td");


            /*
               放假
            */

            if (
                schedule[day] === null
            ) {

                if (person === 0) {

                    cell.className =
                        "holiday-cell";

                    cell.rowSpan = 2;

                    cell.textContent =
                        "🎉 放假";

                    row.appendChild(cell);

                }

            }


            /*
               正常排班
            */

            else {

                cell.innerHTML =
                    "<span class='number'>" +
                    schedule[day][person] +
                    "</span>";

                row.appendChild(cell);

            }

        }


        result.appendChild(row);

    }

}


/* ================================
   點選放假後自動更新
================================ */

for (let day of days) {

    document
        .getElementById(day[1])
        .addEventListener(
            "change",
            makeSchedule
        );

}


/* ================================
   更改星期一第一位
   自動更新
================================ */

start.addEventListener(
    "change",
    makeSchedule
);


/* ================================
   網頁開啟時產生表格
================================ */

makeSchedule();

</script>

</body>

</html>
